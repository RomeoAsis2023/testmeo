<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P Video Call (Serverless)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #1a1a1a;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1200px; width: 100%; }
        h1 { text-align: center; margin-bottom: 20px; font-weight: 400; font-size: 1.8rem; }
        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        input {
            padding: 12px 16px;
            border: 1px solid #444;
            border-radius: 8px;
            background: #2a2a2a;
            color: #fff;
            font-size: 1rem;
            outline: none;
            min-width: 200px;
        }
        input:focus { border-color: #4a9eff; }
        button {
            padding: 12px 24px;
            background: #4a9eff;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.2s;
        }
        button:hover { background: #3a8eef; }
        button:disabled { background: #555; cursor: not-allowed; }
        .videos {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }
        .video-wrapper {
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            aspect-ratio: 4/3;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .label {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
        }
        .status {
            text-align: center;
            margin-top: 20px;
            color: #aaa;
            font-size: 0.9rem;
        }
        .status.active { color: #4eff91; }
        .hidden { display: none; }
        @media (max-width: 700px) {
            .videos { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔗 P2P Video Call</h1>

        <div class="controls" id="controls">
            <input type="text" id="roomInput" placeholder="Enter room name..." value="demo-room-123">
            <button id="joinBtn">Join Call</button>
            <button id="leaveBtn" class="hidden" disabled>Leave Call</button>
        </div>

        <div class="status" id="status">Enter a room name and click Join.</div>

        <div class="videos" id="videos">
            <div class="video-wrapper">
                <video id="localVideo" autoplay muted playsinline></video>
                <span class="label">You</span>
            </div>
            <div class="video-wrapper" id="remoteWrapper">
                <video id="remoteVideo" autoplay playsinline></video>
                <span class="label" id="remoteLabel">Remote</span>
            </div>
        </div>
    </div>

    <!-- Trystero: Serverless WebRTC signaling via BitTorrent trackers -->
    <script type="module">
        import { joinRoom } from 'https://cdn.jsdelivr.net/npm/trystero@0.21.7/bit torrent.min.js';
        import SimplePeer from 'https://cdn.jsdelivr.net/npm/simple-peer@9.11.1/simplepeer.min.js';

        // DOM elements
        const roomInput = document.getElementById('roomInput');
        const joinBtn = document.getElementById('joinBtn');
        const leaveBtn = document.getElementById('leaveBtn');
        const statusEl = document.getElementById('status');
        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');
        const remoteLabel = document.getElementById('remoteLabel');
        const videosContainer = document.getElementById('videos');
        const controls = document.getElementById('controls');

        let localStream = null;
        let room = null;
        let peers = {}; // peerId -> SimplePeer instance

        // --- Utility: Update Status ---
        function setStatus(msg, active = false) {
            statusEl.textContent = msg;
            statusEl.classList.toggle('active', active);
        }

        // --- Clean up everything ---
        function leaveCall() {
            if (room) {
                room.leave();
                room = null;
            }
            Object.values(peers).forEach(p => p.destroy());
            peers = {};
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }
            localVideo.srcObject = null;
            remoteVideo.srcObject = null;
            remoteLabel.textContent = 'Remote';

            joinBtn.disabled = false;
            leaveBtn.disabled = true;
            leaveBtn.classList.add('hidden');
            joinBtn.classList.remove('hidden');
            roomInput.disabled = false;
            setStatus('Call ended. Ready to join again.');
        }

        // --- Main: Join a Room ---
        async function joinCall() {
            const roomName = roomInput.value.trim();
            if (!roomName) {
                setStatus('Please enter a room name.');
                return;
            }

            joinBtn.disabled = true;
            roomInput.disabled = true;
            setStatus('Requesting camera/mic...');

            // 1. Get local media
            try {
                localStream = await navigator.mediaDevices.getUserMedia({
                    video: true,
                    audio: true
                });
                localVideo.srcObject = localStream;
            } catch (err) {
                console.error('Media error:', err);
                setStatus('Camera/Mic access denied. Please allow permissions and reload.');
                joinBtn.disabled = false;
                roomInput.disabled = false;
                return;
            }

            setStatus(`Joining room "${roomName}"...`);

            // 2. Join the Trystero room (serverless signaling)
            //    This uses public BitTorrent trackers for signaling.
            try {
                room = joinRoom({ appId: 'p2p-video-demo-v1' }, roomName);
            } catch (err) {
                console.error('Trystero error:', err);
                setStatus('Failed to join room. Please try again.');
                joinBtn.disabled = false;
                roomInput.disabled = false;
                if (localStream) {
                    localStream.getTracks().forEach(t => t.stop());
                    localStream = null;
                }
                return;
            }

            // 3. Trystero event: peer found
            room.onPeerJoin(peerId => {
                console.log('Peer joined:', peerId);
                setStatus(`Peer connected (${peerId.slice(0, 8)}). Establishing P2P connection...`);

                // Create a SimplePeer connection as the initiator
                const peer = new SimplePeer({
                    initiator: true,
                    trickle: true,
                    stream: localStream,
                    config: {
                        iceServers: [
                            { urls: 'stun:stun.l.google.com:19302' },
                            { urls: 'stun:stun1.l.google.com:19302' }
                        ]
                    }
                });

                peers[peerId] = peer;

                // When we have signaling data, send it to the remote peer via Trystero
                peer.on('signal', data => {
                    room.sendSignal(data, peerId);
                });

                // When remote stream arrives
                peer.on('stream', stream => {
                    remoteVideo.srcObject = stream;
                    remoteLabel.textContent = `Peer (${peerId.slice(0, 6)})`;
                    setStatus(`✅ Connected to peer ${peerId.slice(0, 8)}!`, true);
                });

                peer.on('error', err => {
                    console.error('Peer error:', err);
                    setStatus(`Connection error: ${err.message}`);
                });

                peer.on('close', () => {
                    console.log('Peer closed:', peerId);
                    delete peers[peerId];
                    remoteVideo.srcObject = null;
                    remoteLabel.textContent = 'Remote';
                    setStatus('Peer disconnected.');
                });
            });

            // 4. Trystero event: receive signaling data
            room.onSignal((data, peerId) => {
                console.log('Signal from:', peerId, data.type || 'candidate');
                let peer = peers[peerId];

                // If we don't have a peer yet, create one (non-initiator)
                if (!peer) {
                    peer = new SimplePeer({
                        initiator: false,
                        trickle: true,
                        stream: localStream,
                        config: {
                            iceServers: [
                                { urls: 'stun:stun.l.google.com:19302' },
                                { urls: 'stun:stun1.l.google.com:19302' }
                            ]
                        }
                    });

                    peers[peerId] = peer;

                    peer.on('signal', data => {
                        room.sendSignal(data, peerId);
                    });

                    peer.on('stream', stream => {
                        remoteVideo.srcObject = stream;
                        remoteLabel.textContent = `Peer (${peerId.slice(0, 6)})`;
                        setStatus(`✅ Connected to peer ${peerId.slice(0, 8)}!`, true);
                    });

                    peer.on('error', err => {
                        console.error('Peer error:', err);
                        setStatus(`Connection error: ${err.message}`);
                    });

                    peer.on('close', () => {
                        delete peers[peerId];
                        remoteVideo.srcObject = null;
                        remoteLabel.textContent = 'Remote';
                        setStatus('Peer disconnected.');
                    });
                }

                // Feed the signaling data into SimplePeer
                peer.signal(data);
            });

            // 5. Trystero event: peer left
            room.onPeerLeave(peerId => {
                console.log('Peer left:', peerId);
                if (peers[peerId]) {
                    peers[peerId].destroy();
                    delete peers[peerId];
                }
                remoteVideo.srcObject = null;
                remoteLabel.textContent = 'Remote';
                if (Object.keys(peers).length === 0) {
                    setStatus('All peers disconnected. Waiting for others...');
                }
            });

            // Update UI
            joinBtn.classList.add('hidden');
            leaveBtn.classList.remove('hidden');
            leaveBtn.disabled = false;
            setStatus(`Joined room "${roomName}". Waiting for peer...`, true);
        }

        // --- Event Listeners ---
        joinBtn.addEventListener('click', joinCall);
        leaveBtn.addEventListener('click', leaveCall);

        // Allow Enter key in the room input
        roomInput.addEventListener('keydown', e => {
            if (e.key === 'Enter' && !joinBtn.disabled) {
                joinCall();
            }
        });

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            if (room) room.leave();
            Object.values(peers).forEach(p => p.destroy());
            if (localStream) localStream.getTracks().forEach(t => t.stop());
        });
    </script>
</body>
</html>
